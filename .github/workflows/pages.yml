name: Publicar en GitHub Pages

# Publica copiando main a la rama gh-pages, que GitHub Pages sirve directamente.
# (El método "GitHub Actions" requiere activar Pages a mano; este no.)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Actualizar rama gh-pages
        run: git push origin HEAD:gh-pages --force
